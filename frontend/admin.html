<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Exam Portal | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #f43f5e;
            --dark: #0f172a;
            --sidebar-bg: #1e293b;
            --bg: #f1f5f9;
        }
        body { background-color: var(--bg); font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        /* Sidebar Styling */
        .sidebar { background: var(--sidebar-bg); min-height: 100vh; position: fixed; width: 260px; transition: 0.3s; z-index: 1000; box-shadow: 4px 0 10px rgba(0,0,0,0.1); }
        .sidebar-brand { padding: 30px 20px; font-weight: 700; font-size: 1.5rem; color: white; display: flex; align-items: center; }
        .sidebar-brand i { color: var(--primary); margin-right: 12px; }
        .nav-link { color: #94a3b8; padding: 12px 20px; margin: 4px 15px; border-radius: 12px; transition: 0.2s; font-weight: 500; }
        .nav-link:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-link.active { color: white; background: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
        .nav-link i { width: 24px; margin-right: 10px; }

        /* Content Area */
        .main-content { margin-left: 260px; padding: 40px; transition: 0.3s; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        /* Stats Cards */
        .stat-card { background: white; border-radius: 20px; padding: 25px; border: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); transition: 0.3s; position: relative; overflow: hidden; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .stat-card i { position: absolute; right: -10px; bottom: -10px; font-size: 5rem; opacity: 0.05; color: var(--primary); }
        .stat-title { color: #64748b; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--dark); margin: 10px 0; }

        /* Tables */
        .table-card { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .table thead th { background: #f8fafc; border: none; padding: 15px; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        .table tbody td { padding: 18px 15px; vertical-align: middle; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
        .user-avatar { width: 40px; height: 40px; background: #e0e7ff; color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-right: 12px; }

        /* Actions */
        .btn-action { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; border: none; }
        .btn-delete { background: #fee2e2; color: #ef4444; }
        .btn-delete:hover { background: #ef4444; color: white; }
        .btn-view { background: #e0e7ff; color: var(--primary); }
        .btn-view:hover { background: var(--primary); color: white; }

        @media (max-width: 992px) {
            .sidebar { width: 80px; }
            .sidebar-brand span, .nav-link span { display: none; }
            .main-content { margin-left: 80px; }
        }
    </style>
</head>
<body>

<!-- Login Overlay -->
<div id="login-overlay" style="position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center;">
    <div class="stat-card text-center" style="width: 100%; max-width: 400px; padding: 40px;">
        <div class="user-avatar mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2rem;">
            <i class="fas fa-user-shield"></i>
        </div>
        <h3 class="fw-bold mb-1">Admin Access</h3>
        <p class="text-muted mb-4">Enter your credentials to continue</p>
        
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold text-muted">PASSWORD</label>
            <input type="password" id="admin-pass-input" class="form-control form-control-lg rounded-3 border-0 shadow-sm" placeholder="••••••••" style="background: #f8fafc;">
        </div>
        
        <button class="btn btn-primary btn-lg w-100 rounded-3 mb-3" onclick="checkAdminLogin()">
            Unlock Dashboard
        </button>
        <a href="index.html" class="text-decoration-none text-muted small">Return to Home</a>
    </div>
</div>

<!-- Sidebar (hidden by default) -->
<div class="sidebar d-none" id="admin-sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-bolt"></i>
        <span>EXAM PORTAL</span>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link active" href="#" onclick="showTab('users', this)">
            <i class="fas fa-users"></i> <span>Students</span>
        </a>
        <a class="nav-link" href="#" onclick="showTab('results', this)">
            <i class="fas fa-poll"></i> <span>Results</span>
        </a>
        <a class="nav-link" href="#" onclick="showTab('questions', this)">
            <i class="fas fa-question-circle"></i> <span>Questions</span>
        </a>
        <a class="nav-link" href="#" onclick="showTab('settings', this)">
            <i class="fas fa-cog"></i> <span>Settings</span>
        </a>
        <div style="margin-top: auto; padding-top: 50px;">
            <hr style="background: rgba(255,255,255,0.1); margin: 20px 15px;">
            <a class="nav-link text-accent" href="index.html">
                <i class="fas fa-sign-out-alt"></i> <span>Logout Admin</span>
            </a>
        </div>
    </nav>
</div>

<!-- Main Content (hidden by default) -->
<div class="main-content d-none" id="admin-main">
    <div class="top-bar">
        <div>
            <h5 class="text-muted mb-1">Welcome back,</h5>
            <h2 id="tab-title" class="fw-bold">Student Directory</h2>
        </div>
        <button class="btn btn-dark px-4 py-2 rounded-3" onclick="loadData()">
            <i class="fas fa-sync-alt me-2"></i> Refresh
        </button>
    </div>

    <!-- Stats Grid -->
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-title">Total Students</div>
                <div class="stat-value" id="total-users">0</div>
                <div class="text-success small fw-bold"><i class="fas fa-arrow-up"></i> Active Users</div>
                <i class="fas fa-users"></i>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-title">Completed Exams</div>
                <div class="stat-value" id="total-results">0</div>
                <div class="text-primary small fw-bold">Global Results</div>
                <i class="fas fa-graduation-cap"></i>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-title">Question Bank</div>
                <div class="stat-value" id="total-questions">1.8k+</div>
                <div class="text-warning small fw-bold">Verified Items</div>
                <i class="fas fa-database"></i>
            </div>
        </div>
    </div>

    <!-- Data Section -->
    <div class="table-card" id="data-section">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead id="table-head">
                    <!-- Headers injected here -->
                </thead>
                <tbody id="table-body">
                    <!-- Data injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Settings Section -->
    <div id="settings-section" class="d-none">
        <div class="row">
            <div class="col-md-6">
                <div class="table-card">
                    <h4 class="fw-bold mb-4">Admin Security</h4>
                    <form id="updateAdminPassForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">NEW ADMIN PASSWORD</label>
                            <input type="password" id="new-admin-pass" class="form-control form-control-lg rounded-3 border-0 shadow-sm" style="background: #f8fafc;" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
