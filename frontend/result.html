<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result | Analytics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%); 
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            padding: 20px;
        }
        .result-card {
            background: white;
            border-radius: 40px;
            padding: 50px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .digital-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            color: #0369a1;
            text-shadow: 2px 2px 0px rgba(14, 165, 233, 0.1);
            margin: 20px 0;
        }
        .chart-box {
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
        }
        .btn-action {
            padding: 15px 30px;
            border-radius: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            border: none;
        }
        .btn-dashboard { background: #0ea5e9; color: white; }
        .btn-dashboard:hover { background: #0284c7; transform: scale(1.03); color: white; }
        .btn-subject { background: #f0f9ff; color: #0369a1; border: 2px solid #bae6fd !important; }
        .btn-subject:hover { background: #e0f2fe; }
    </style>
</head>
<body>

<div class="result-card">
    <h1 class="fw-bold mb-1" style="color: #0f172a;">Test Completed!</h1>
    <p class="text-muted mb-4">Here is your performance summary</p>

    <!-- Digital Display -->
    <div class="digital-score" id="score-display">0/20</div>

    <!-- Pie Chart -->
    <div class="chart-box">
        <canvas id="resultChart"></canvas>
    </div>

    <!-- Controls -->
    <div class="d-grid gap-3 mt-4">
        <a href="dashboard.html" class="btn btn-dashboard btn-action shadow-sm">
            <i class="fas fa-th-large me-2"></i>Back to Dashboard
        </a>
        <a href="subject.html" class="btn btn-subject btn-action">
            <i class="fas fa-redo me-2"></i>Try Another Subject
        </a>
    </div>
</div>

<script src="config.js"></script>
<script src="result.js"></script>
</body>
</html>
