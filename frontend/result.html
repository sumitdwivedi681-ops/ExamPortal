<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result | Analytics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 50px;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
            text-align: center;
        }
        .digital-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            margin: 20px 0;
        }
        .chart-box {
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
        }
        .btn-action {
            padding: 15px 30px;
            border-radius: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="result-card">
    <h1 class="fw-bold mb-1">Test Completed!</h1>
    <p class="opacity-75 mb-4">Here is your performance summary</p>

    <!-- Digital Display -->
    <div class="digital-score" id="score-display">0/20</div>

    <!-- Pie Chart -->
    <div class="chart-box">
        <canvas id="resultChart"></canvas>
    </div>

    <!-- Controls -->
    <div class="d-grid gap-3 mt-4">
        <a href="dashboard.html" class="btn btn-light btn-action text-primary shadow-lg">
            <i class="fas fa-th-large me-2"></i>Back to Dashboard
        </a>
        <a href="subject.html" class="btn btn-outline-light btn-action">
            <i class="fas fa-redo me-2"></i>Try Another Subject
        </a>
    </div>
</div>

<script src="config.js"></script>
<script src="result.js"></script>
</body>
</html>
