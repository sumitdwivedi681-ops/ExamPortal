<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Test Portal</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
             <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap logo-icon"></i>Exams Portal</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="#register">Register</a></li>
                    </ul>
                </div>
        </div>
    </nav>
<section class="hero">
    <div class="container">
        <h1>Online Test System for Students</h1>
        <p class="lead mt-3">Register, Login & Start Learning With Smart Online Exams</p>
    </div>
</section>
    <div class="container my-5" id="register">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-center mb-3">Create Account</h3>
                    <form id="registerForm">
    <input type="text" id="full_name" placeholder="Full Name" class="form-control mb-3" required>
    <input type="email" id="register_email" placeholder="Email" class="form-control mb-3" required>
    <input type="password" id="register_password" placeholder="Password" class="form-control mb-3" required>

    <select id="course" class="form-control mb-3">
        <option>Select Course</option>
        <option>BCA</option>
        <option>BBA</option>
        <option>B.Tech</option>
        <option>MCA</option>
    </select>

    <button class="btn btn-primary w-100" type="submit">Register</button>
</form>

                </div>
            </div>
        </div>
    </div>
    <div class="container my-5" id="login">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-center mb-3">Login</h3>
                    <form id="loginForm">
                        <input type="email" id="login-email" placeholder="Email" class="form-control mb-3" required>
                        <input type="password" id="login-password" placeholder="Password" class="form-control mb-3" required>
                    <button class="btn btn-success w-100" type="submit">Login</button>
                    </form>

             </div>
            </div>
        </div>
    </div>
<footer>
  <p>© 2025 Student Online Test Portal</p>
</footer>
<div id="successPopup" class="popup-container">
    <div class="popup-box">
        <h2 id="popupText">Successfully!</h2>
        <button id="popupBtn">OK</button>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
